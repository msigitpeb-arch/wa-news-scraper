name: Daily Tech News to WhatsApp

on:
  schedule:
    # 08:00 UTC = 15:00 WIB (3 Sore)
    - cron: '0 8 * * *'
    # 14:00 UTC = 21:00 WIB (9 Malam)
    - cron: '0 14 * * *'
  # Memungkinkan pengujian manual melalui tombol "Run workflow" di GitHub
  workflow_dispatch:

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scraper & Send WA
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET_NUMBER: ${{ secrets.WA_TARGET_NUMBER }}
        run: |
          python daily_scraper.py
