name: Daily Tech News to WhatsApp (manual fallback)

# Jadwal utama sekarang jalan di VPS (cron 15:00 & 21:00 WIB) memakai LLM via 9router.
# Workflow ini hanya cadangan manual. Runner GitHub tidak bisa menjangkau 9router,
# jadi di sini script otomatis memakai mode ekstraktif (--no-llm).

on:
  workflow_dispatch:

jobs:
  scrape-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Scraper & Send WA
        env:
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          WA_TARGET_NUMBER: ${{ secrets.WA_TARGET_NUMBER }}
        run: |
          python daily_scraper.py --no-llm
